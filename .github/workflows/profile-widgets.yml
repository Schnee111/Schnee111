name: Update profile widgets

on:
  schedule:
    - cron: "*/20 * * * *" # Every 20 minutes
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-widgets.yml"
  workflow_dispatch:

jobs:
  update-widgets:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=radical&hide_border=true&border_radius=25&date_format=j%20M%5B%20Y%5D&card_width=500&card_height=200
          path: profile/streak.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&theme=radical&custom_title=Schnee's%20Stats&commits_year=2026&include_all_commits=true&show_icons=true&hide_border=true&border_radius=25&rank_icon=github&line_height=30&card_width=400
          path: profile/stats.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&hide=Shell,TeX,BibTex%20Style,jupyter%20notebook,HTML,CSS&layout=compact&theme=radical&hide_border=true&border_radius=25&langs_count=8&card_width=300
          path: profile/top-langs.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate activity graph
        env:
          TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git clone --depth 1 https://github.com/Ashutosh00710/github-readme-activity-graph.git /tmp/activity-engine
          cd /tmp/activity-engine
          npm install --legacy-peer-deps
          npm run build
          node -e '
            const { Utilities } = require("/tmp/activity-engine/dist/utils.js");
            const { Fetcher } = require("/tmp/activity-engine/dist/fetcher.js");
            const fs = require("fs");
            async function render() {
              const query = {
                username: "Schnee111",
                theme: "radical",
                hide_border: "true",
                border_radius: "25",
                area: "true"
              };
              const utils = new Utilities(query);
              const fetcher = new Fetcher(utils.username);
              const queryOptions = utils.queryOptions();
              const calendarData = await fetcher.fetchContributions(queryOptions.days, queryOptions.from, queryOptions.to);
              const { finalGraph } = await utils.buildGraph(calendarData);
              fs.mkdirSync("/home/runner/work/Schnee111/Schnee111/profile", { recursive: true });
              fs.writeFileSync("/home/runner/work/Schnee111/Schnee111/profile/activity-graph.svg", finalGraph);
              console.log("Rendered activity-graph.svg successfully");
            }
            render();
          '

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --staged --quiet; then
            echo "No changes in SVG files. Skipping commit."
          else
            git commit -m "chore(widgets): update profile stats, languages, streak and activity graph [skip ci]"
            git push origin main
          fi
